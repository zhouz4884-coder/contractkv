claim_boundaries:
  - Micro-chunk scheduling only bounds interference to one chunk in the model; it does not prove sub-ms or zero interference.
  - Ephemeral commit and rollback are O(B), where B is the number of physical blocks.
  - Residency pressure is separate from semantic certificate validity.
  - Drift-budget thresholds require real answer-changing future-turn calibration plus in-situ margin signals.
